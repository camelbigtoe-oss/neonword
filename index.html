<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>NEONWORD</title>
  <meta name="description" content="A cyberpunk pixel word puzzle. Crack the code in six tries." />
  <meta name="theme-color" content="#0b0620" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="neon" data-game="menu">
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <div id="app">
    <header class="top">
      <div class="top-left">
        <button class="icon-btn btn-home" aria-label="Game menu"><svg viewBox="0 0 7 7" width="14" height="14" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M3 0h1v1h1v1h1v1h1v1h-1v3h-2v-2h-1v2h-2v-3h-1v-1h1v-1h1v-1h1z"/></svg></button>
        <button class="icon-btn" id="btn-help" aria-label="How to play">?</button>
      </div>
      <div class="logo" data-text="NEONWORD">NEONWORD</div>
      <div class="top-right">
        <button class="icon-btn" id="btn-full" aria-label="Fullscreen" hidden>⛶</button>
        <button class="icon-btn" id="btn-sound" aria-label="Radio and sound"><span class="note">♪</span><span class="mini-eq"><i></i><i></i><i></i></span></button>
        <button class="icon-btn" id="btn-themes" aria-label="Themes">◆</button>
        <button class="icon-btn" id="btn-history" aria-label="Word history">≡</button>
        <button class="icon-btn" id="btn-stats" aria-label="Stats">▤</button>
      </div>
    </header>

    <section class="hud">
      <div class="lvl">
        <span class="lvl-label">LV <b id="lvl">1</b></span>
        <div class="xpbar"><div class="xpfill" id="xpfill"></div></div>
        <span class="xp-txt" id="xptxt">0/100</span>
      </div>
      <div class="credits" title="Hint credits"><span class="chip-ico">◈</span><b id="credits">0</b></div>
    </section>

    <nav class="modes">
      <button class="mode-btn" data-mode="daily">DAILY<span class="streak" id="streak-badge"></span></button>
      <button class="mode-btn" data-mode="endless">ENDLESS</button>
      <div class="lens" id="lens">
        <button class="len-btn" data-len="4">4</button>
        <button class="len-btn" data-len="5">5</button>
        <button class="len-btn" data-len="6">6</button>
        <button class="len-btn" data-len="7">7</button>
      </div>
    </nav>

    <section class="intel" id="intel" aria-live="polite">
      <div class="intel-line dim">&gt; uplink ready. crack the code.</div>
    </section>

    <main class="board-wrap">
      <div class="board" id="board"></div>
    </main>

    <section class="hints" id="hints">
      <button class="hint-btn" data-hint="burn"><span class="h-name">BURN</span><span class="h-cost">◈1</span></button>
      <button class="hint-btn" data-hint="check"><span class="h-name">SCAN</span><span class="h-cost">◈1</span></button>
      <button class="hint-btn" data-hint="reveal"><span class="h-name">REVEAL</span><span class="h-cost">◈2</span></button>
      <button class="hint-btn" data-hint="clue"><span class="h-name">CLUE</span><span class="h-cost">◈2</span></button>
    </section>

    <section class="keyboard" id="keyboard"></section>
  </div>

  <!-- Game picker -->
  <div id="menu">
    <div class="menu-head">
      <div class="logo menu-logo" data-text="NEON ARCADE">NEON ARCADE</div>
      <p class="menu-sub">&gt; insert cartridge_</p>
      <div class="menu-hud"><span class="m-cr">◈<b id="m-credits">0</b> credits</span></div>
    </div>
    <div class="carts">
      <button class="cart" data-go="word">
        <div class="cart-art"><i class="tile hit">N</i><i class="tile near">E</i><i class="tile miss">O</i><i class="tile hit">N</i></div>
        <div class="cart-title">NEONWORD</div>
        <div class="cart-desc">Crack the hidden code word in six tries.</div>
        <div class="cart-status" id="m-word"></div>
      </button>
      <button class="cart links-pal" data-go="links">
        <div class="cart-art grid4"><i class="g0"></i><i class="g0"></i><i class="g1"></i><i class="g1"></i><i class="g2"></i><i class="g2"></i><i class="g3"></i><i class="g3"></i></div>
        <div class="cart-title">NEONLINK</div>
        <div class="cart-desc">Sort 16 words into 4 secret links.</div>
        <div class="cart-status" id="m-links"></div>
      </button>
      <button class="cart trace-pal" data-go="trace">
        <div class="cart-art trace-art"><i>N</i><i class="on">E</i><i>O</i><i class="on">T</i><i class="on">R</i><i>A</i></div>
        <div class="cart-title">NEONTRACE</div>
        <div class="cart-desc">Trace hidden theme words through a letter maze.</div>
        <div class="cart-status" id="m-trace"></div>
      </button>
    </div>
    <div class="menu-foot">
      <button class="icon-btn" id="m-sound" aria-label="Radio and sound"><span class="note">♪</span><span class="mini-eq"><i></i><i></i><i></i></span></button>
      <button class="icon-btn" id="m-themes" aria-label="Themes">◆</button>
      <button class="icon-btn" id="m-backup" aria-label="Backup">▤</button>
    </div>
  </div>

  <!-- NEONLINK -->
  <div id="links">
    <header class="top">
      <div class="top-left">
        <button class="icon-btn btn-home" aria-label="Game menu"><svg viewBox="0 0 7 7" width="14" height="14" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M3 0h1v1h1v1h1v1h1v1h-1v3h-2v-2h-1v2h-2v-3h-1v-1h1v-1h1v-1h1z"/></svg></button>
        <button class="icon-btn" id="l-help" aria-label="How to play">?</button>
      </div>
      <div class="logo" data-text="NEONLINK">NEONLINK</div>
      <div class="top-right">
        <button class="icon-btn" id="l-sound" aria-label="Radio and sound"><span class="note">♪</span><span class="mini-eq"><i></i><i></i><i></i></span></button>
        <button class="icon-btn" id="l-scenes" aria-label="Scenes">◆</button>
        <button class="icon-btn" id="l-stats" aria-label="Stats">▤</button>
      </div>
    </header>

    <section class="hud">
      <div class="lvl">
        <span class="lvl-label">LV <b id="l-lvl">1</b></span>
        <div class="xpbar"><div class="xpfill" id="l-xpfill"></div></div>
        <span class="xp-txt" id="l-xptxt">0/100</span>
      </div>
      <div class="credits" title="Hint credits"><span class="chip-ico">◈</span><b id="l-credits">0</b></div>
    </section>

    <nav class="modes">
      <button class="mode-btn" data-lmode="daily">DAILY<span class="streak" id="l-streak"></span></button>
      <button class="mode-btn" data-lmode="endless">ENDLESS</button>
      <div class="l-lives" id="l-lives"></div>
    </nav>

    <section class="intel" id="l-intel" aria-live="polite"></section>

    <main class="l-board" id="l-board">
      <div class="l-solved" id="l-solved"></div>
      <div class="l-grid" id="l-grid"></div>
    </main>

    <section class="hints l-hints">
      <button class="hint-btn" data-act="pair"><span class="h-name">PAIR</span><span class="h-cost">◈1</span></button>
      <button class="hint-btn" data-act="name"><span class="h-name">DECODE</span><span class="h-cost">◈2</span></button>
      <button class="hint-btn" data-act="shuffle"><span class="h-name">SHUFFLE</span><span class="h-cost">free</span></button>
      <button class="hint-btn" data-act="clear"><span class="h-name">CLEAR</span><span class="h-cost">free</span></button>
    </section>

    <button class="l-submit" id="l-submit">SUBMIT 0/4</button>
  </div>

  <!-- NEONTRACE -->
  <div id="trace">
    <header class="top">
      <div class="top-left">
        <button class="icon-btn btn-home" aria-label="Game menu"><svg viewBox="0 0 7 7" width="14" height="14" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M3 0h1v1h1v1h1v1h1v1h-1v3h-2v-2h-1v2h-2v-3h-1v-1h1v-1h1v-1h1z"/></svg></button>
        <button class="icon-btn" id="t-help" aria-label="How to play">?</button>
      </div>
      <div class="logo" data-text="NEONTRACE">NEONTRACE</div>
      <div class="top-right">
        <button class="icon-btn" id="t-sound" aria-label="Radio and sound"><span class="note">♪</span><span class="mini-eq"><i></i><i></i><i></i></span></button>
        <button class="icon-btn" id="t-stats" aria-label="Stats">▤</button>
      </div>
    </header>

    <section class="hud">
      <div class="lvl">
        <span class="lvl-label">LV <b id="t-lvl">1</b></span>
        <div class="xpbar"><div class="xpfill" id="t-xpfill"></div></div>
        <span class="xp-txt" id="t-xptxt">0/100</span>
      </div>
      <div class="credits" title="Hint credits"><span class="chip-ico">◈</span><b id="t-credits">0</b></div>
    </section>

    <nav class="modes">
      <button class="mode-btn" data-tmode="daily">DAILY<span class="streak" id="t-streak"></span></button>
      <button class="mode-btn" data-tmode="endless">ENDLESS</button>
      <div class="t-prog" id="t-prog"></div>
    </nav>

    <section class="t-theme">
      <span class="t-label">THEME</span>
      <div class="t-clue" id="t-clue"></div>
      <div class="t-word" id="t-word"></div>
    </section>

    <main class="t-wrap" id="t-wrap">
      <div class="t-board" id="t-board">
        <svg class="t-lines" id="t-lines" aria-hidden="true"></svg>
        <div class="t-cells" id="t-cells"></div>
      </div>
    </main>

    <section class="t-ctrls">
      <button class="hint-btn" id="t-clear"><span class="h-name">CLEAR</span><span class="h-cost">free</span></button>
      <button class="hint-btn t-hint" id="t-hint"><span class="h-name">HINT</span><span class="t-meter" id="t-meter"></span><span class="h-cost" id="t-hint-cost">◈2</span></button>
    </section>
  </div>

  <div class="toasts" id="toasts"></div>

  <!-- Modal -->
  <div class="modal-back" id="modal-back" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-x" id="modal-x" aria-label="Close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="words.js"></script>
  <script src="audio.js"></script>
  <script src="radio.js"></script>
  <script src="lake.js"></script>
  <script src="space.js"></script>
  <script src="bg.js"></script>
  <script src="links-data.js"></script>
  <script src="links.js"></script>
  <script src="trace-data.js"></script>
  <script src="trace.js"></script>
  <script src="app.js"></script>
</body>
</html>
